name: Build ShareX-HDR

on:
  push:
    branches:
      - hdr-dev
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**/*.md"
      - "**/.gitignore"
      - "**/.gitattributes"

permissions:
  contents: read

jobs:
  build:
    name: Build portable (x64)
    runs-on: windows-latest

    env:
      SOLUTION_FILE_PATH: ShareX.sln
      ASSEMBLY_INFO_PATH: Directory.build.props

    outputs:
      app_version: ${{ steps.version.outputs.app_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set APP_VERSION
        id: version
        run: |
          $content = Get-Content "${{ env.ASSEMBLY_INFO_PATH }}" -Raw
          $pattern = '<Version>([0-9]+(?:\.[0-9]+){1,3})</Version>'
          $match = [regex]::Match($content, $pattern)
          if (-not $match.Success) {
            Write-Error "Could not read version from Directory.build.props"
            exit 1
          }
          $version = $match.Groups[1].Value
          echo $version
          echo "APP_VERSION=$version" >> $env:GITHUB_ENV
          echo "app_version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: |
          dotnet restore --runtime win-x64 "${{ env.SOLUTION_FILE_PATH }}"
          dotnet restore --runtime win-x64 "ShareX.Setup\ShareX.Setup.csproj"

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Platform=x64 --self-contained true /m:1 "${{ env.SOLUTION_FILE_PATH }}"

      - name: Test HDR color pipeline
        run: dotnet test --no-build --configuration Release -p:Platform=x64 "ShareX.ScreenCaptureLib.Tests\ShareX.ScreenCaptureLib.Tests.csproj"

      - name: Build ShareX.Setup
        run: dotnet build --no-restore --configuration Release -p:Platform=x64 --self-contained true "ShareX.Setup\ShareX.Setup.csproj"

      - name: Package portable build
        run: ShareX.Setup\bin\Release\win-x64\ShareX.Setup.exe -silent -job Release -platform x64

      - name: Upload portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: ShareX-HDR-portable-x64
          path: Output\ShareX-${{ env.APP_VERSION }}-portable-x64.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Download portable artifact
        uses: actions/download-artifact@v8
        with:
          name: ShareX-HDR-portable-x64
          path: Output

      - name: Create release notes
        env:
          APP_VERSION: ${{ needs.build.outputs.app_version }}
        run: |
          $file = Get-ChildItem -Path "Output" -Filter "ShareX-$env:APP_VERSION-portable-x64.zip" | Select-Object -First 1
          if (-not $file) {
            Write-Error "Portable zip not found in artifact"
            exit 1
          }
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash
          $body = @"
          ShareX-HDR portable build for Windows x64 (includes ffmpeg).

          | File | SHA256 |
          | --- | --- |
          | $($file.Name) | ``$hash`` |
          "@
          $body | Out-File -FilePath RELEASE_BODY.md -Encoding utf8
          $body >> $env:GITHUB_STEP_SUMMARY

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ShareX-HDR ${{ github.ref_name }}
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: Output/ShareX-${{ needs.build.outputs.app_version }}-portable-x64.zip
