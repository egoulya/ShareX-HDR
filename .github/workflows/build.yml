name: Build ShareX-HDR

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build:
    name: Build and release (x64)
    runs-on: windows-latest

    env:
      SOLUTION_FILE_PATH: ShareX.sln
      ASSEMBLY_INFO_PATH: Directory.build.props

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set APP_VERSION from tag
        id: version
        run: |
          if ($env:GITHUB_REF -notmatch '^refs/tags/v(\d+\.\d+\.\d+)$') {
            Write-Error "Tag must match vMAJOR.MINOR.PATCH (example: v21.0.2). Got: $env:GITHUB_REF"
            exit 1
          }
          $version = $Matches[1]
          $content = Get-Content "${{ env.ASSEMBLY_INFO_PATH }}" -Raw
          $pattern = '<Version>([0-9]+(?:\.[0-9]+){1,3})</Version>'
          $match = [regex]::Match($content, $pattern)
          if ($match.Success -and $match.Groups[1].Value -ne $version) {
            Write-Warning "Directory.build.props has $($match.Groups[1].Value) but tag is $version"
          }
          echo $version
          echo "APP_VERSION=$version" >> $env:GITHUB_ENV
          echo "app_version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Restore
        run: |
          dotnet restore --runtime win-x64 "${{ env.SOLUTION_FILE_PATH }}"
          dotnet restore --runtime win-x64 "ShareX.Setup\ShareX.Setup.csproj"

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Platform=x64 --self-contained true /m:1 "${{ env.SOLUTION_FILE_PATH }}"

      - name: Test HDR color pipeline
        run: dotnet test --no-build --configuration Release -p:Platform=x64 "ShareX.ScreenCaptureLib.Tests\ShareX.ScreenCaptureLib.Tests.csproj"

      - name: Build ShareX.Setup
        run: dotnet build --no-restore --configuration Release -p:Platform=x64 --self-contained true "ShareX.Setup\ShareX.Setup.csproj"

      - name: Package portable and setup
        run: ShareX.Setup\bin\Release\win-x64\ShareX.Setup.exe -silent -job Release -platform x64

      - name: Verify outputs
        run: |
          $portable = "Output\ShareX-$env:APP_VERSION-portable-x64.zip"
          $setup = "Output\ShareX-$env:APP_VERSION-setup-x64.exe"
          if (-not (Test-Path $portable)) { Write-Error "Missing $portable"; exit 1 }
          if (-not (Test-Path $setup)) { Write-Error "Missing $setup"; exit 1 }

      - name: Create release notes
        run: |
          $files = @(
            "Output\ShareX-$env:APP_VERSION-portable-x64.zip",
            "Output\ShareX-$env:APP_VERSION-setup-x64.exe"
          )
          $rows = foreach ($path in $files) {
            $name = Split-Path $path -Leaf
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash
            "| $name | ``$hash`` |"
          }
          $body = @"
          ShareX-HDR release for Windows x64 (includes ffmpeg).

          | File | SHA256 |
          | --- | --- |
          $($rows -join "`r`n")
          "@
          $body | Out-File -FilePath RELEASE_BODY.md -Encoding utf8
          $body >> $env:GITHUB_STEP_SUMMARY

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ShareX-HDR ${{ env.APP_VERSION }}
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            Output/ShareX-${{ env.APP_VERSION }}-portable-x64.zip
            Output/ShareX-${{ env.APP_VERSION }}-setup-x64.exe
